<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" id="dynamic-favicon" type="image/png" href="/logo/GDCCLOGO_Square.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Dev Club Club!</title>
  <meta name="description" content="A club for game dev clubs." />

  <!-- (Discord / social embeds) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Game Dev Club Club" />
  <meta property="og:title" content="Game Dev Club Club!" />
  <meta property="og:description" content="A club for game dev clubs." />
  <meta property="og:url" content="https://gamedevclubclub.com/" />
  <meta property="og:image" content="https://gamedevclubclub.com/embed_thumbnail.gif" />
  <meta property="og:image:type" content="image/gif" />
  <meta property="og:image:width" content="800" />
  <meta property="og:image:height" content="344" />
  <meta property="og:image:alt" content="Game Dev Club Club" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta content="#EA5C5C" data-react-helmet="true" name="theme-color" />
</head>

<body>
  <style>
    @media (pointer: fine) and (min-width: 769px) {
      html,
      body,
      .no-cursor {
        cursor: none !important;
      }
    }
  </style>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <script>
    const frames = [
      '/logo/GDCCLOGO_Square.png',
      '/logo/GDCCLOGO_Square2.png'
    ];

    // Force the browser to cache the images in memory
    const preloadedImages = [];
    frames.forEach((src) => {
      const img = new Image();
      img.src = src;
      preloadedImages.push(img);
    });

    let currentFrame = 0;
    const favicon = document.getElementById('dynamic-favicon');

    // Browsers handle 800ms to 1000ms much more consistently than 500ms.
    setInterval(() => {
      currentFrame = (currentFrame + 1) % frames.length;
      favicon.href = preloadedImages[currentFrame].src;
    }, 350); 
  </script>
</body>

</html>
